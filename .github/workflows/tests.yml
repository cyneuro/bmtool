name: tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scipy h5py

      - name: Install bmtool without NEURON/BMTK
        run: pip install -e . --no-deps

      - name: Run unit tests
        run: pytest tests -m unit
